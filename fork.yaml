title: "Layr-Labs/mlx-c - MLX C fork diff overview"
footer: |
  Fork-diff overview of [`Layr-Labs/mlx-c`](https://github.com/Layr-Labs/mlx-c), a fork of
  [`ml-explore/mlx-c`](https://github.com/ml-explore/mlx-c) &middot; the C bridge in Layr-Labs'
  Apple-silicon inference stack ([`mlx`](https://github.com/Layr-Labs/mlx) →
  [`mlx-c`](https://github.com/Layr-Labs/mlx-c) → [`mlx-swift`](https://github.com/Layr-Labs/mlx-swift) →
  [`mlx-swift-lm`](https://github.com/Layr-Labs/mlx-swift-lm)) &middot; created with
  [Forkdiff](https://github.com/protolambda/forkdiff)
base:
  name: ml-explore/mlx-c
  url: https://github.com/ml-explore/mlx-c
  # The last upstream commit merged into this fork. CI (`scripts/check_forkdiff.py`)
  # requires this to equal `git merge-base HEAD upstream/main`. Each upstream merge
  # moves this hash and re-validates every section below.
  # Upstream main as of 2026-10-22 (57731b0, bindings for MLX 0.32.4).
  hash: 57731b00e8bed710e0750e7356da9f18f8eb3e20
fork:
  name: Layr-Labs/mlx-c
  url: https://github.com/Layr-Labs/mlx-c
  ref: refs/heads/main
def:
  title: "Layr-Labs/mlx-c"
  description: |
    This is an overview of the changes in [`Layr-Labs/mlx-c`](https://github.com/Layr-Labs/mlx-c),
    a fork of [`ml-explore/mlx-c`](https://github.com/ml-explore/mlx-c).

    MLX C is the C boundary between the MLX core and every other language binding. Layr-Labs
    runs an LLM/VLM serving stack on Apple silicon — continuous batching, paged KV caches,
    MoE and quantized kernels — built as [`mlx-swift-lm`](https://github.com/Layr-Labs/mlx-swift-lm)
    on [`mlx-swift`](https://github.com/Layr-Labs/mlx-swift), which links a forked
    [`mlx`](https://github.com/Layr-Labs/mlx) core through this fork. Every change here is a
    **carry-patch**: a thin C wrapper over a function the forked core added, so Swift can reach
    it. The upstream API and ABI are left untouched; the fork only adds entry points, and pins
    the core it builds against to the Layr-Labs revision that provides them.

    Downstream consumers are named per section so a change here can be traced to the Swift
    symbol that needs it.
  sub:
    - title: "Core pin"
      description: |
        `CMakeLists.txt` fetches the MLX core from `Layr-Labs/mlx` at an exact commit instead of
        an upstream release tag. The C functions below wrap core functions that only exist on the
        fork, so the pin is what makes them link; it is bumped together with the header changes
        each time the core gains a new entry point.
        The current pin is `ea318ee0`, the core that Layr-Labs/mlx-swift builds for the cluster
        stack. It contains main's previous pin `ff4bb35b` and the sealed reduce-scatter and
        all-gather (`360d11b9`) that `distributed_sealed.cpp` calls.
        The current pin also preserves 512- and 1024-thread custom Metal launch geometry
        while retrying an insufficient pipeline with its explicit compiler capacity,
        orders the fast-synch GPU wait after every pending pass on its queue (a CPU-stream
        collective between two GPU passes could otherwise leave the GPU spinning forever),
        and carries 1 MiB JACCL frames, batched buffer retention, a cached custom-kernel
        source per kernel (host time only), the streamed sealed all-sum (per-piece
        AES-256-GCM over a two-rank JACCL exchange), opt-in fused fence updates and
        fenced custom-kernel inputs, and cheaper custom-kernel launches and graph
        bookkeeping (host time only), and the thread-scoped command-buffer commit limits. The
        page-backed footprint change is reverted, as on the single-Mac stack.
      globs:
        - "CMakeLists.txt"
    - title: "Memory: allocator observability and footprint policy"
      description: |
        The Swift admission code decides whether a request fits by asking the allocator, and the
        upstream C API only offered independent counters. The fork adds, in order of arrival:

        - `mlx_get_num_resources` / `mlx_get_resource_limit` — the live Metal buffer *count* and
          its hard ceiling, the quantity behind the `[metal::malloc] Resource limit exceeded`
          crash (consumed as `Memory.numResources` / `Memory.resourceLimit` in mlx-swift).
        - `mlx_get_memory_snapshot` — one coherent active/cache/peak observation instead of three
          separate calls that can straddle an allocation.
        - `mlx_get_allocation_footprint_policy` and its checked `_bound` / `_maximum_extra`
          helpers — the allocator's immutable rounding geometry (alignment, rounding threshold,
          minimum allocation, power-of-two cut-off, cache page size) so callers can compute the
          real footprint of a requested size without allocating; bound helpers return 1 on an
          invalid policy or overflow without raising through the error callback.
        - `mlx_get_allocation_size_upper_bound` — the same bound for the current policy.

        The generator override in `python/mlxhooks.py` keeps `mlx_get_memory_snapshot` intact
        when the bindings are regenerated from the core headers.
      globs:
        - "mlx/c/memory.h"
        - "mlx/c/memory.cpp"
        - "python/mlxhooks.py"
    - title: "Memory: optional process allocation cap"
      description: |
        `mlx_install_process_allocation_cap` installs the core's install-once Metal backing cap
        and `mlx_get_process_allocation_cap_snapshot` reads its ledger (limit, fixed heap, live,
        cached, pending, unreclaimed, charged and peak bytes). Both forward to the matching core
        accounting and report failures through the error handler; CPU and CUDA builds refuse.
        The standalone example checks that interface. Consumed as
        `Memory.installProcessAllocationCap` / `Memory.processAllocationCapSnapshot` in mlx-swift.
      globs:
        - "mlx/c/memory_cap.cpp"
        - "examples/cap-tests/memory_cap.cpp"
    - title: "Array: buffer metadata and constant-cache identity"
      description: |
        Two non-evaluating inspections the quantized-inference path in mlx-swift relies on:

        - `mlx_array_get_buffer_info` — backing metadata (allocated bytes, data offset, element
          count, row-contiguity, uniqueness) for an *already evaluated* array. Unavailable backing
          is reported as `available=false` rather than forcing an eval or a stream sync; views may
          report shared backing and the fields confer no ownership.
          `unique` comes from `array::is_uniquely_referenced()` in the Layr-Labs/mlx core: no other
          array references the array or its data. It does not require MLX to own the buffer, so a
          wrapped external buffer can be unique (upstream #4634 made `is_donatable()` require
          ownership).
        - `_mlx_array_constant_cache_identity` — the backing descriptor's identity plus a
          transform-safety predicate, so a Swift constant cache can reuse an unchanged constant's
          exact cast across calls without mistaking a mutated array for its former contents. It
          refuses compile/autodiff tracing and retained graphs, and never evaluates, hashes, or
          reads data back. Marked internal: the caller must retain the source descriptor while
          the identity is cached.
      globs:
        - "mlx/c/array.h"
        - "mlx/c/array.cpp"
    - title: "Fast: mutable and fenced inputs and per-kernel math modes"
      description: |
        - `mlx_fast_metal_kernel_new_mutable` — a second constructor for custom Metal kernels
          that declares which caller-owned input buffers the kernel writes (the core's
          mutable-input contract, used for in-place paged KV updates). The existing constructor
          and its read-only ABI are unchanged.
        - `mlx_fast_metal_kernel_new_fenced` — the same with fenced inputs: inputs that can come
          from a CPU stream in the same eval, which the kernel waits for itself (core
          `metal_kernel_with_fenced_inputs`, opt-in `MLX_METAL_FENCED_INPUTS=1`).
        - `mlx_fast_metal_kernel_new_with_options` adds an explicit safe, relaxed or fast
          compiler math mode for one custom kernel, including mutable-input metadata.
          Legacy constructors remain unchanged; this does not alter process-wide defaults.
          Non-safe modes require operation-specific numerical and platform qualification.
          The generator extension retains `new_mutable` and `new_with_options` when bindings
          regenerate. It does not yet emit `new_fenced` or the prepared-launch functions, so a
          regeneration must carry those hand edits over.
        - `mlx_fast_metal_kernel_launch_new` / `_apply` / `_free` — a prepared launch: a kernel
          bound once to a copied config and applied to new inputs without rebuilding the
          config (host time only). The kernel must outlive the launch.
          `MLX_C_BUILD_TESTS` enables constructor/error-contract tests without GPU execution.
      globs:
        - "mlx/c/fast.h"
        - "mlx/c/fast.cpp"
        - "python/metal_kernel_options.py"
        - "tests/metal_kernel_options.cpp"
        - "docs/src/fast.rst"
    - title: "Stream: cross-thread default streams"
      description: |
        MLX 0.32 made the default stream's Metal command encoder thread-local, so a graph built
        on one thread and evaluated on another — Swift `async/await` continuations, actor
        executors — aborts with `There is no Stream(gpu, N) in current thread`.
        `mlx_thread_unsafe_cpu_stream_new` / `mlx_thread_unsafe_gpu_stream_new` expose the
        core's `new_thread_unsafe_stream`, whose encoder is registered globally, letting
        mlx-swift restore a single process-wide default stream. "Thread-unsafe" means the caller
        serializes submission; it is not locked for concurrent multi-thread use.
        Upstream now binds the same core function as `mlx_stream_new_thread_unsafe(dev)`.
        The fork keeps its two no-argument names because the Layr-Labs/mlx-swift `Stream`
        code calls them. Remove them when mlx-swift calls the upstream name.
      globs:
        - "mlx/c/stream.h"
        - "mlx/c/stream.cpp"
    - title: "Fork tooling"
      description: |
        The gate that keeps this page honest: `check_forkdiff.py` fails CI when `base.hash`
        is not the merge-base with upstream, or when a file the fork changes is not described
        by a section above. `FORKDIFF.md` explains the day-to-day; the README links the page.
      globs:
        - "scripts/check_forkdiff.py"
        - "FORKDIFF.md"
        - "README.md"

    - title: "Cluster bootstrap and sealed collectives"
      description: |
        The feature branch carries the bounded owner-provided bootstrap exchange,
        sealed two-rank all-sum bridge (whole-frame and streamed per-piece codec
        callbacks, `mlx_distributed_set_streamed_seal_codec`), and the sealed two-rank
        reduce-scatter and all-gather (`mlx_distributed_reduce_scatter_sealed`,
        `mlx_distributed_all_gather_sealed`) on the same codec and counter.
        Bootstrap validates dimensions and sequences but its owner authenticates
        the channel. Sealed collective callbacks retain their existing no-reentry
        contract. These
        pre-existing feature changes remain present when adding startup waits.
      globs:
        - "mlx/c/distributed_bootstrap.cpp"
        - "mlx/c/private/distributed_bootstrap.h"
        - "mlx/c/distributed_group.h"
        - "mlx/c/distributed_sealed.cpp"
    - title: "Distributed: bounded one-shot startup readiness"
      description: |
        The begin/end startup-wait C entry points validate group handles and
        finite 1..900000 ms bounds, then forward to the matching core Group API.
        Exceptions report through the existing error handler and return failure.
        The embedding runtime drains work, serializes transitions and retains
        cancellation, authentication and memory safeguards. CPU-only standalone
        tests cover argument refusal, forwarding and unsupported backends.
      globs:
        - "mlx/c/distributed_group.cpp"
        - "tests/standalone/*"

# ignored globally, does not count towards line count
ignore:
  - "fork.yaml"
  - ".github/**"
