# Manual qualification only. Never merge this workflow replacement.
name: Classic native-only forkdiff canary (never merge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, ARM64, darkbloom-linux-arm64]
    timeout-minutes: 5
    steps:
      - name: Require native Linux ARM64
        env:
          NATIVE_RUNNER: ${{ runner.name }}
        run: |
          [[ "$NATIVE_RUNNER" == darkbloom-* ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2bef31cfb39b1261bee0789062e30977bf347e55
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify the fixed fork description
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 scripts/check_forkdiff.py
          git rev-parse HEAD
          printf 'Classic native-only forkdiff completed on %s\n' "$RUNNER_NAME"
